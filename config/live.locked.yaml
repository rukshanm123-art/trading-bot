# =====================================================================
# LIVE configuration — LOCKED. Read docs/LIVE_TRADING_CHECKLIST.md first.
#
# Starting this config will be REFUSED until ALL of the following hold:
#   * >= 30 calendar days and >= 300 recorded PAPER decisions
#   * paper daily report(s) and a backtest report exist
#   * the full test suite passed within 72h with >=100 tests, coverage and
#     named safety tests verified (make record-tests)
#   * `python -m trading_bot live unlock` ceremony completed (typed phrase)
#   * LIVE_TRADING_ENABLED=true in the environment
#   * BINANCE_LIVE_API_KEY has withdrawals DISABLED (verified via API)
#
# DAILY_APPROVAL is enforced: after each daily report the bot stops opening
# positions until you run `trading-bot approve --hours 24`.
# =====================================================================
mode: live
symbol: BTCUSDT
interval: 1h
timezone: Pacific/Auckland

db:
  url: sqlite:///var/trading_bot_live.db   # use postgresql:// in production

data:
  source: exchange

strategy:
  name: ema_trend
  version: "1.0.0"
  params:
    fast: 12
    slow: 26
    stop_loss_pct: "2.0"

risk:
  max_open_positions: 1
  max_position_allocation_pct: "20"
  min_cash_reserve_pct: "50"
  max_risk_per_trade_pct: "0.5"
  max_daily_loss_pct: "2"
  max_7d_loss_pct: "5"
  max_drawdown_pct: "8"
  max_entries_per_day: 2
  cooldown_after_loss_hours: 12
  pause_after_consecutive_losses: 3
  max_slippage_bps: "50"
  max_spread_bps: "20"
  max_quote_age_s: 120
  candle_grace_s: 90
  max_gap_pct: "10"
  max_api_errors_per_hour: 10
  max_reconciliation_mismatch_quote: "0.05"
  protective_exit_buffer_bps: "100"
  max_clock_skew_s: 30
  market_data_recovery_successes: 2

execution:
  order_type: MARKET
  limit_timeout_s: 60
  max_order_age_s: 120
  submit_timeout_s: 10

paper:
  starting_quote: "30"   # unused in live; schema completeness only
  seed: 42
  taker_fee_bps: "10"
  spread_bps: "5"
  slippage_bps_max: "8"
  reject_probability: "0"
  partial_fill_probability: "0"
  latency_ms: 0

continuation:
  mode: daily_approval          # enforced default for live
  approve_default_hours: 24

notifications:
  console: true
  email: { enabled: false }     # enable + set SMTP_* env for production
  telegram: { enabled: false }  # enable + set TELEGRAM_* env for production

monitoring:
  enabled: true
  host: 127.0.0.1
  port: 9754

reporting:
  daily_time_local: "17:00"
  output_dir: var/reports

emergency_position_policy: hold_and_monitor
